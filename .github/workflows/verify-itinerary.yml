name: Verify travel handbook itinerary build
on:
  push:
    branches: [main]
    paths:
      - 'build.sh'
      - 'patch-itinerary.mjs'
      - 'patch-cappadocia.mjs'
      - '.source/**'
      - '.github/workflows/verify-itinerary.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild page and apply itinerary
        run: bash build.sh
      - name: Verify required Istanbul stops and preserve dates
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('public/index.html','utf8');
          const start = html.indexOf('const days = ')+13;
          const end = html.indexOf('\n];',start);
          if (start<13 || end<0) throw new Error('Cannot read itinerary data');
          const days=JSON.parse(html.slice(start,end+2));
          if(days.length!==17)throw new Error('Expected 17 trip days');
          const required={
            '11/14':['加拉塔塔','Galata Konak Cafe','加拉塔大桥','公共轮渡'],
            '11/15':['蓝色清真寺','Seven Hills','圣索菲亚'],
            '11/18':['SAW机场 → Sultanahmet酒店'],
            '11/19':['苏莱曼尼耶','多尔玛巴赫切','奥塔科伊清真寺','Ortaköy','Üsküdar','Salacak','少女塔'],
            '11/20':['地下水宫']
          };
          for(const [date,stops] of Object.entries(required)){
            const day=days.find(d=>d.date===date);
            if(!day)throw new Error('Missing date '+date);
            const title=day.items.map(e=>e.title).join(' | ');
            for(const stop of stops){
              if(!title.includes(stop))throw new Error('Missing '+stop+' on '+date);
            }
          }
          const d15=days.find(d=>d.date==='11/15');
          const d19=days.find(d=>d.date==='11/19');
          if(d15.items.some(x=>x.title.includes('多尔玛巴赫切')))throw Error('Palace must move off 15 Nov');
          if(!d19.items.some(x=>x.title.includes('15:50') || x.time.includes('15:50')))throw Error('19 Nov ferry missing');
          const findTime=(day,needle)=>day.items.find(x=>x.title.includes(needle))?.time??'';
          console.log('15 Nov: '+d15.items.map(x=>x.time+' '+x.title).join(' | '));
          console.log('19 Nov: '+d19.items.map(x=>x.time+' '+x.title).join(' | '));
          console.log('PASS: 17-day itinerary, all revised Istanbul stops present.');
          NODE
      - name: Verify Cappadocia hotel, booking, and map update
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('public/index.html', 'utf8');
          const start = html.indexOf('const days = ') + 13;
          const end = html.indexOf('\n];', start);
          const days = JSON.parse(html.slice(start, end + 2));
          const d15 = days.find(d => d.date === '11/15');
          const d16 = days.find(d => d.date === '11/16');
          if (d15?.route.at(-1) !== 'Ala Stone Hotel Goreme') throw Error('15 Nov endpoint wrong');
          if (d16?.route[0] !== 'Ala Stone Hotel Goreme') throw Error('16 Nov origin wrong');
          for (const term of ['11/15–11/16｜Ala Stone Hotel', 'Kapadokya Sokak No:15',
            'Ala Stone Hotel Goreme', '11/16｜Mithra Cave Hotel', '11/17｜Sacred House']) {
            if (!html.includes(term)) throw Error('Missing booking or map info: ' + term);
          }
          if (/Angels City|\bNar\b|纳尔/.test(html)) throw Error('Old Nar hotel remains');
          console.log('PASS: 15-16 Nov hotel, route, map and luggage plans updated; later bookings unchanged.');
          NODE
      - name: Verify ferry timetable guide and inline JavaScript syntax
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const html=fs.readFileSync('public/index.html','utf8');
          for(const token of [
            '轮渡查询｜其他班次、官方时刻表、Google Maps',
            'const ferrySchedules = ',
            'Karaköy → Kadıköy（去程）',
            'Kadıköy → Eminönü（直接回旧城）',
            'Ortaköy → Üsküdar｜周四全部直达班次',
            'https://www.google.com/maps/dir/?api=1',
            'Kadikoy Sehir Hatlari Iskelesi Istanbul',
            'Eminonu Sehir Hatlari Iskelesi Istanbul'
          ]) {
            if(!html.includes(token))throw new Error('Missing ferry guide content: '+token);
          }
          const scripts=[...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];
          let checked=0;
          for(const m of scripts){
            if(/\bsrc\s*=/.test(m[1]) || !m[2].trim())continue;
            new vm.Script(m[2],{filename:'inline-trip-script-'+checked+'.js'});
            checked++;
          }
          if(!checked)throw new Error('No inline JavaScript checked');
          console.log('PASS: ferry guide, Google Maps links, map piers and '+checked+' inline scripts parse correctly');
          NODE
      - name: Check Cloudflare live version (informational)
        run: |
          SITE="https://green-snow-6c3b.c2942016420.workers.dev/?check=ist-20261102-${{ github.sha }}"
          for attempt in 1 2 3 4 5; do
            echo "Cloudflare live verification attempt $attempt"
            if curl -fsSL --compressed --connect-timeout 10 --max-time 30 -H "Cache-Control: no-cache" "$SITE" -o /tmp/verity-travel-live.html; then
              if grep -Fq 'Salacak海滨｜少女塔' /tmp/verity-travel-live.html && grep -Fq 'Ortaköy → Üsküdar' /tmp/verity-travel-live.html && grep -Fq 'Seven Hills → 圣索菲亚' /tmp/verity-travel-live.html && grep -Fq '轮渡查询｜其他班次、官方时刻表、Google Maps' /tmp/verity-travel-live.html && grep -Fq 'Kadıköy → Eminönü（直接回旧城）' /tmp/verity-travel-live.html; then
                echo 'LIVE_CONFIRMED: Cloudflare HTML includes current Istanbul itinerary, full ferry guide, and Google Maps links.'
                exit 0
              fi
              echo 'LIVE_NOT_UPDATED: response loaded, but revised itinerary not yet found.'
            else
              echo 'LIVE_UNREACHABLE: Cloudflare HTTP request failed.'
            fi
            sleep 12
          done
          echo '::warning::Cloudflare live version could not be confirmed; GitHub source and build are verified.'
