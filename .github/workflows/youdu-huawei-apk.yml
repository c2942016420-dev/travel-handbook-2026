name: Build Youdu Huawei APK
on:
  push:
    branches:
      - youdu-teahouse-protected
    paths:
      - 'teahouse/android-app/**'
      - 'teahouse/assets/brand-logo.png'
      - '.github/workflows/youdu-huawei-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Use original user-provided logo for launcher icon
        run: |
          mkdir -p teahouse/android-app/app/src/main/res/drawable-nodpi
          cp teahouse/assets/brand-logo.png teahouse/android-app/app/src/main/res/drawable-nodpi/brand_logo.png
          test -s teahouse/android-app/app/src/main/res/drawable-nodpi/brand_logo.png
      - name: Build Android APK
        run: gradle -p teahouse/android-app :app:assembleDebug --no-daemon --stacktrace
      - name: Validate APK exists
        run: |
          test -s teahouse/android-app/app/build/outputs/apk/debug/app-debug.apk
          file teahouse/android-app/app/build/outputs/apk/debug/app-debug.apk
      - name: Save Huawei installer
        uses: actions/upload-artifact@v4
        with:
          name: youdu-huawei-apk-test
          path: teahouse/android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
