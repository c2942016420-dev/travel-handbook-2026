name: Build Youdu V18 Android Resource Routing Fix Unsigned
on:
  push:
    branches: [youdu-teahouse-protected]
    paths:
      - 'teahouse/android-app/**'
      - 'teahouse/index.html'
      - 'teahouse/*.js'
      - 'teahouse/assets/**'
      - 'teahouse/tests/**'
      - '.github/workflows/youdu-huawei-apk.yml'
  workflow_dispatch:

# Security: this repository is public. NEVER publish a keystore, signing
# password or a public Actions artifact containing a signing key.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch code without release-signing credentials
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Test cloud single-master safety and optional printing
        run: |
          set -eu
          node teahouse/tests/v12-regression.test.cjs
          node teahouse/tests/v13-regression.test.cjs
          node teahouse/tests/v14-iphone-viewer.test.cjs
          node teahouse/tests/v14-1-checkout.test.cjs
          node teahouse/tests/v14-2-iphone-report-rights.test.cjs
          node teahouse/tests/v15-pricing-inventory.test.cjs
          node teahouse/tests/v16-expenses.test.cjs
      - name: Test complete ordering and checkout DOM with production scripts
        run: |
          set -eu
          npm install --prefix "$RUNNER_TEMP/youdu-ui-tests" --no-audit --no-fund --ignore-scripts jsdom@26.1.0
          YOUDU_TEST_JS_MODULES="$RUNNER_TEMP/youdu-ui-tests/node_modules" node teahouse/tests/v17-order-editor.test.cjs
      - name: Verify separate production package and no keystore in repository
        run: |
          set -eu
          grep -Fq "applicationId 'com.youdu.teahouse.cashier'" teahouse/android-app/app/build.gradle
          grep -Fq 'versionCode 180' teahouse/android-app/app/build.gradle
          if grep -Ei 'storePassword|keyPassword|signingConfig' teahouse/android-app/app/build.gradle; then
            echo "ERROR: Release signing code detected in public source" >&2
            exit 1
          fi
          if find teahouse -type f \( -name '*.jks' -o -name '*.p12' -o -name '*.keystore' \) | grep -q .; then
            echo "ERROR: Signing key detected in public source" >&2
            exit 1
          fi
      - name: Bundle complete Huawei offline UI and original logo
        run: |
          set -eu
          python3 teahouse/android-app/tools/prepare_offline_assets.py
          mkdir -p teahouse/android-app/app/src/main/res/drawable-nodpi
          cp teahouse/assets/brand-logo.png teahouse/android-app/app/src/main/res/drawable-nodpi/brand_logo.png
          test -s teahouse/android-app/app/src/main/res/drawable-nodpi/brand_logo.png
      - name: Compile unsigned installable resources
        run: gradle -p teahouse/android-app :app:assembleRelease --no-daemon --stacktrace
      - name: Validate, align and preserve unsigned APK for private signing
        run: |
          set -eu
          mkdir -p /tmp/youdu-unsigned /tmp/youdu-toolchain
          sdk_tools="$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -n1)"
          apksignerjar="$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' | sort -V | tail -n1)"
          test -x "$sdk_tools"
          test -s "$apksignerjar"
          apk="teahouse/android-app/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$apk"
          aligned="/tmp/youdu-unsigned/youdu-v18-aligned-unsigned.apk"
          "$sdk_tools" -f -v 4 "$apk" "$aligned"
          "$sdk_tools" -c -v 4 "$aligned"
          python3 teahouse/android-app/tools/verify_apk_routes.py "$aligned"
          unzip -Z1 "$aligned" > /tmp/youdu-unsigned-files.txt
          for resource in index.html enhancements-v17-reports.js enhancements-v7.js backup-client-v7.js corrections-v8.js sync-client-v12.js receipt-client-v17.js excel-v15.js enhancements-v17.js native-offline-v14_1.js; do
            grep -Fx "assets/youdu/$resource" /tmp/youdu-unsigned-files.txt
          done
          unzip -p "$aligned" assets/youdu/index.html | grep -Fq "const KEY='youdu_tea_house_v3'"
          unzip -p "$aligned" assets/youdu/index.html | grep -Fq 'window.YouduNative?.checkpoint'
          unzip -p "$aligned" assets/youdu/native-offline-v14_1.js | grep -Fq 'primaryReady'
          if unzip -p "$aligned" assets/youdu/index.html | grep -Fq 'serviceWorker.register'; then
            echo 'ERROR: production installer requires a live website' >&2
            exit 1
          fi
          cp "$apksignerjar" /tmp/youdu-toolchain/apksigner.jar
          java -jar /tmp/youdu-toolchain/apksigner.jar --help >/dev/null
          echo 'V18_NATIVE_ROUTES_AND_UI_VERIFIED'
      - name: Save unsigned release (NO PRIVATE KEY)
        uses: actions/upload-artifact@v4
        with:
          name: youdu-v18-aligned-unsigned
          path: /tmp/youdu-unsigned/youdu-v18-aligned-unsigned.apk
          retention-days: 30
          if-no-files-found: error
      - name: Save Android apksigner tool (NO PRIVATE KEY)
        uses: actions/upload-artifact@v4
        with:
          name: youdu-v18-public-signing-tool
          path: /tmp/youdu-toolchain/apksigner.jar
          retention-days: 30
          if-no-files-found: error


