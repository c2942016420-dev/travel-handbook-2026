function fee(s,at=Date.now()){

 if(s.mode==='tea'){

  const night=nightHours*Number(r.teaNightHourly||0);
  return {base,day,night,goods,total:num(base+day+night+goods),end,overMs,dayHours,nightHours,missingRate};
 }
 const r=s.rates,base=num(r.gamePrice+(s.renewals||0)*r.renewPrice),end=+new Date(s.startedAt)+(r.gameHours+(s.renewals||0)*r.renewHours)*3600000;
 const started=new Date(s.startedAt);const midnight=new Date(started);midnight.setHours(0,0,0,0);if(started.getHours()>=7)midnight.setDate(midnight.getDate()+1);

function stat(label,n,suffix='',warn=false){return `<div class="stat ${warn?'warn':''}"><span class="stat-label">${label}</span><strong class="stat-number">${n}${suffix?`<small>${suffix}</small>`:''}</strong></div>`;}
function roomCard(r){const s=activeRoom(r),status=roomStatus(r),late=status==='late';const name=r.name;let info='<span class="muted">等待客人入座</span>',bottom='可立即开台';if(s){const f=fee(s),used=timer(Date.now()-+new Date(s.startedAt));info=`<div>${fmtDate(s.startedAt).slice(11)} 开台 · ${s.guests} 人</div><div class="strong ${late?'red':''}" data-room-timer="${esc(r.id)}">${late?'超时 '+timer(f.overMs):'已用 '+used}</div>`;bottom='已用 '+used;}return `<div class="room-card ${status==='using'?'using':late?'late':''}"><div class="room-top"><div class="room-name">${esc(name)}</div><span class="pill ${status==='using'?'active':late?'late':''}">${status==='free'?'空闲':late?'已超时':'使用中'}</span></div><div class="room-info">${info}</div><div class="room-actions"><small>${esc(bottom)}</small><button class="room-button" data-action="open-room" data-id="${esc(r.id)}">${s?'管理 / 结账':'＋ 开台'}</button></div></div>`;}
function roomsPage(){const onFloor=data.rooms.filter(r=>r.floor===ui.floor);const occ=onFloor.filter(r=>activeRoom(r)),late=onFloor.filter(r=>roomStatus(r)==='late');const groups=[...new Set(onFloor.map(r=>r.group))];const shown=r=>ui.roomFilter==='all'||ui.roomFilter===roomStatus(r)||(ui.roomFilter==='using'&&roomStatus(r)==='late');return `${title('房态总览','茶席和棋牌分楼层管理，不再混用开台类型。')} ${hero()}<div class="stats">${stat('本楼层房间',onFloor.length,'间')}${stat('正在使用',occ.length,'间')}${stat('当前空闲',onFloor.length-occ.length,'间')}${stat('已超时',late.length,'间',late.length>0)}</div><div class="switchline"><div class="chip-group"><button data-action="choose-floor" data-floor="2" class="${ui.floor===2?'active':''}">二楼 · 茶席</button><button data-action="choose-floor" data-floor="3" class="${ui.floor===3?'active':''}">三楼 · 麻将棋牌</button></div><div class="chip-group"><button class="${ui.roomFilter==='all'?'active':''}" data-action="room-filter" data-filter="all">全部</button><button class="${ui.roomFilter==='free'?'active':''}" data-action="room-filter" data-filter="free">空闲</button><button class="${ui.roomFilter==='using'?'active':''}" data-action="room-filter" data-filter="using">使用中</button></div></div>${groups.map(g=>{const set=onFloor.filter(r=>r.group===g&&shown(r));return set.length?`<div class="section-header"><h3>${esc(g)}</h3><small>${set.length}间</small><div class="section-line"></div></div><div class="room-grid">${set.map(roomCard).join('')}</div>`:'';}).join('')||'<div class="panel empty">暂无符合条件的房间</div>'}<div class="note">${ui.floor===2?'\u4e8c\u697c\u8336\u5e2d\uff1a\u901a\u5e38\u5305\u542b4\u5c0f\u65f6\uff0c\u8d85\u65f6\u81ea\u52a8\u8ba1\u8d39\uff1b22:00\u540e\u7684\u8d85\u65f6\u630940\u5143/\u5c0f\u65f6\u8ba1\u7b97\u3002\u65e5\u95f4\u8d85\u65f6\u5355\u4ef7\u5c1a\u5f85\u786e\u8ba4\uff0c\u8bf7\u5148\u5728\u6536\u8d39\u8bbe\u7f6e\u586b\u5199\u3002':'\u4e09\u697c\u9ebb\u5c06\u68cb\u724c\uff1a\u57fa\u7840100\u5143/4\u5c0f\u65f6\uff0c\u8d85\u65f625\u5143/\u5c0f\u65f6\uff0c\u96f6\u70b9\u540e40\u5143/\u5c0f\u65f6\u3002'}}</div>`;}
function productsPage(){const allCats=['全部',...new Set(data.products.map(p=>p.category))],q=ui.search.trim().toLowerCase();const list=data.products.filter(p=>(ui.category==='全部'||p.category===ui.category)&&(!q||p.name.toLowerCase().includes(q)));return `${title('商品菜单','保留原茶单45款商品，也可以随时新增商品、修改名称和价格。',`<button class="btn" data-action="new-product">＋ 新增商品</button>`)}<div class="stats">${stat('菜单商品',data.products.length,'款')}${stat('已上架',data.products.filter(x=>x.active).length,'款')}${stat('茶品',data.products.filter(x=>x.category.includes('茶')).length,'款')}${stat('商品分类',allCats.length-1,'类')}</div><div class="toolbar"><div class="chip-group">${allCats.map(c=>`<button class="${ui.category===c?'active':''}" data-action="category" data-category="${esc(c)}">${esc(c)}</button>`).join('')}</div><input class="search" id="searchProducts" type="search" placeholder="搜索茶名、零食、饮品…" value="${esc(ui.search)}" autocomplete="off"></div><div class="product-grid">${list.map(p=>`<div class="product-card ${p.active?'':'disabled-product'}"><div class="product-head"><strong>${esc(p.name)}</strong><span class="tag">${esc(p.category)}</span></div><div class="product-prices">${p.options.map(o=>`<div><small>${esc(o.label)}</small><br><b>${money(o.price)}</b></div>`).join('')}</div><div class="tiny-actions"><button class="btn small light" data-action="edit-product" data-id="${esc(p.id)}">修改商品</button><button class="textbtn" data-action="toggle-product" data-id="${esc(p.id)}">${p.active?'下架':'上架'}</button></div></div>`).join('')}</div>${!list.length?'<div class="panel empty">没有找到相应的商品</div>':''}<div class="note">商品名称、分类、杯价／壶价及其他售卖单位都能自行调整。还可在修改商品时指定关联库存与每份消耗数量，结账后自动扣减对应库存。</div>`;}
function inventoryPage(){const initialized=data.inventory.filter(x=>x.initialized),unregistered=data.inventory.filter(x=>!x.initialized),low=initialized.filter(x=>x.stock<=x.min&&x.active);const purchases=data.movements.filter(x=>x.type==='inbound');const today=new Date();today.setHours(0,0,0,0);const buyToday=purchases.filter(x=>+new Date(x.date)>=+today).reduce((n,x)=>n+(x.total||0),0);const val=data.inventory.reduce((n,x)=>n+(x.initialized&&x.avgCost!=null?x.stock*x.avgCost:0),0);let content='';if(ui.stockTab==='stock')content=stockList();else content=movementList();return `${title('进货与库存','商品、原料、进货金额和库存变动统一登记。',`<button class="btn light" data-action="new-stock">＋ 新增库存品</button><button class="btn" data-action="purchase">＋ 登记进货</button>`)}<div class="stats">${stat('库存品种',data.inventory.length,'种')}${stat('待录入数量',unregistered.length,'项')}${stat('需要补货',low.length,'项',low.length>0)}${stat('今日进货',money(buyToday))}</div><div class="switchline"><div class="chip-group"><button class="${ui.stockTab==='stock'?'active':''}" data-action="stock-tab" data-tab="stock">库存台账</button><button class="${ui.stockTab==='history'?'active':''}" data-action="stock-tab" data-tab="history">进货及变动记录</button></div><button class="btn small light" data-action="export-csv" data-what="stock">↓ 导出库存 CSV</button></div>${content}<div class="note">已预置茶叶、饮料、小食和用品等示例品种，<strong>不代表真实库存或采购价格</strong>。库存初始显示“待录入”；登记一次进货或盘点后才开始显示真实剩余数量。</div>`;}

 delete data.sessions[room.id];save();closeDialog();ui.view='orders';render();notify(`${room.name} 结账完成 · 实收 ${money(actual)}`);
}
function productSave(form){const newOne=ui.modal.id==='new',old=data.products.find(p=>p.id===ui.modal.id),name=form.elements.name.value.trim(),category=form.elements.category.value.trim();if(!name||!category){notify('请填写商品名称与分类');return;}const opts=[];for(let i=0;i<2;i++){const label=form.elements['unit'+i].value.trim();const str=form.elements['price'+i].value.trim();const stockId=form.elements['stock'+i].value;const consume=Number(form.elements['consume'+i].value||0);if(!label&&!str)continue;if(!label||str===''||!Number.isFinite(Number(str))||Number(str)<0||!Number.isFinite(consume)||consume<0){notify(`规格${i+1}的单位、价格或消耗数量有误`);return;}if(stockId&&consume>0&&!findStock(stockId)){notify('关联的库存品种不存在');return;}opts.push({label,price:num(Number(str)),stockId:stockId||'',consume:stockId?num(consume):0});}if(!opts.length){notify('请至少填写一种商品规格和售价');return;}const p={id:newOne?'prod-'+rid():old.id,name:name.slice(0,60),category:category.slice(0,30),active:old?old.active:true,options:opts};if(newOne)data.products.push(p);else Object.assign(old,p);save();closeDialog();render();notify(newOne?'新商品已添加':'商品设置已保存');}
function stockSave(form){const newOne=ui.modal.id==='new',old=findStock(ui.modal.id);const name=form.elements.name.value.trim(),category=form.elements.category.value.trim(),unit=form.elements.unit.value.trim(),min=Number(form.elements.min.value);if(!name||!category||!unit||!Number.isFinite(min)||min<0){notify('请检查库存档案内容');return;}if(newOne){const raw=(form.elements.opening.value||'').trim(),initial=raw!==''?Number(raw):null,rawcost=(form.elements.cost.value||'').trim(),cost=rawcost!==''?Number(rawcost):null;if((initial!==null&&(!Number.isFinite(initial)||initial<0))||(cost!==null&&(!Number.isFinite(cost)||cost<0))){notify('期初数量或成本有误');return;}const s={id:'in-'+rid(),name,category,unit,min:num(min),initialized:initial!==null,stock:initial===null?0:num(initial),avgCost:cost,lastCost:cost,active:true};data.inventory.push(s);if(initial!==null)data.movements.push({id:rid(),type:'adjust',date:new Date().toISOString(),stockId:s.id,stockName:s.name,unit:s.unit,delta:s.stock,prevStock:0,nextStock:s.stock,note:'新建库存档案 · 期初数量'});}else{if(!old)return;Object.assign(old,{name,category,unit,min:num(min)});}save();closeDialog();render();notify(newOne?'库存品种已添加':'库存档案已修改');}
function purchaseSave(form){const s=findStock(form.elements.stockId.value);if(!s)return;const qty=Number(form.elements.qty.value),cost=Number(form.elements.cost.value),at=new Date(form.elements.date.value);if(!Number.isFinite(qty)||qty<=0||!Number.isFinite(cost)||cost<0||!Number.isFinite(+at)){notify('请检查进货数量、进价和时间');return;}if(+at>Date.now()+86400000){notify('进货时间不能超过明天');return;}const prev=s.initialized?s.stock:0,oldCost=s.avgCost==null?0:s.avgCost,existingValue=Math.max(0,prev)*oldCost;const avgCost=Math.round((existingValue+qty*cost)/(Math.max(0,prev)+qty)*1000000)/1000000;s.stock=num(prev+qty);s.avgCost=avgCost;s.lastCost=Math.round(cost*1000000)/1000000;s.initialized=true;const m={id:rid(),type:'inbound',date:at.toISOString(),stockId:s.id,stockName:s.name,unit:s.unit,delta:num(qty),prevStock:prev,nextStock:s.stock,unitCost:Math.round(cost*1000000)/1000000,total:num(qty*cost),vendor:form.elements.vendor.value.trim().slice(0,80),note:form.elements.note.value.trim().slice(0,200)};data.movements.push(m);save();closeDialog();ui.view='inventory';ui.stockTab='history';render();notify(`进货已登记：${s.name} +${num(qty)}${s.unit}`);}
function adjustSave(form){const s=findStock(ui.modal.id);if(!s)return;const stock=Number(form.elements.stock.value),at=new Date(form.elements.date.value),note=form.elements.note.value.trim();if(!Number.isFinite(stock)||stock<0||!Number.isFinite(+at)||!note){notify('请检查盘点数量、时间及原因');return;}const prev=s.initialized?s.stock:0,delta=num(stock-prev);s.stock=num(stock);s.initialized=true;data.movements.push({id:rid(),type:'adjust',date:at.toISOString(),stockId:s.id,stockName:s.name,unit:s.unit,delta,prevStock:prev,nextStock:s.stock,note:note.slice(0,140)});save();closeDialog();render();notify(`${s.name} 库存已盘点：${num(stock)}${s.unit}`);}
function roomEditSave(form){const newOne=ui.modal.id==='new',old=findRoom(ui.modal.id),name=form.elements.name.value.trim(),group=form.elements.group.value.trim(),floor=Number(form.elements.floor.value);if(!name||!group||![2,3].includes(floor)){notify('请填写房间名称与分组');return;}if(data.rooms.some(x=>x.name===name&&x.floor===floor&&(!old||x.id!==old.id))){notify('本楼层已有相同名称的房间');return;}if(old&&data.sessions[old.id]&&floor!==old.floor){notify('请先完成当前房间结账，再调整楼层');return;}if(newOne)data.rooms.push({id:`${floor}-${rid()}`,floor,name,group,provisional:false});else Object.assign(old,{name,group,floor,provisional:false});save();closeDialog();render();notify(newOne?'房间已新增':'房间已修改');}

function exportCSV(what){let head,rows;if(what==='orders'){head=['订单号','楼层','房间','开台时间','结账时间','人数','收费类别','原价应收','商品改价调整','系统应收（改价后）','实际收款','结账差额','实收与原价差额','房间费','商品费','付款方式','商品明细（原价与本单价）','备注'];rows=data.orders.map(o=>[o.id,o.floor,o.room,o.startedAt,o.closedAt,o.guests,o.mode,o.originalDue??o.due,o.goodsAdjustment??0,o.due,o.actual,o.difference,num(o.actual-(o.originalDue??o.due)),o.roomFee,o.goodsFee,o.payment,(o.items||[]).map(x=>x.name+'('+x.label+')×'+x.qty+' 原名称:'+(x.originalName??x.name)+' 原单价:'+Number(x.originalPrice??x.price)+' 本单单价:'+x.price+(x.temporary?' [临时商品]':'')).join(';'),o.note]);}else{head=['库存名称','分类','计量单位','库存数量','平均成本','最近进价'];rows=data.inventory.filter(x=>x.active&&x.initialized).map(x=>[x.name,x.category,x.unit,x.stock,x.avgCost??'',x.lastCost??'']);}exportFile(`有度茶舍_${what==='orders'?'营业订单':'进货库存'}_${inputDate(Date.now()).slice(0,10)}.csv`,[head,...rows].map(row=>row.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');notify('CSV文件已生成');}
function restoreFile(file){const reader=new FileReader();reader.onload=()=>{try{const s=JSON.parse(String(reader.result||''));if(s.version!==3||!Array.isArray(s.rooms)||!Array.isArray(s.products)||!Array.isArray(s.inventory)||!Array.isArray(s.orders)||!Array.isArray(s.movements)||!s.sessions||!s.rates)throw Error('格式不符合');if(!confirm(`确认导入备份吗？\n这会覆盖当前设备的房态、商品、进货和历史订单。建议先导出当前数据。`))return;data={...defaults(),...s,audit:Array.isArray(s.audit)?s.audit:[],reportAdjustments:Array.isArray(s.reportAdjustments)?s.reportAdjustments:[],expenses:Array.isArray(s.expenses)?s.expenses:[]};save();closeDialog();render();notify('已恢复备份，账目扩展字段已兼容旧版');}catch(err){notify('备份文件无效，必须使用有度茶舍 V3 JSON备份');}};reader.readAsText(file);}

(function(){
  const bar=document.getElementById('offlineBar'),label=document.getElementById('offlineLabel');
  const isSecure=window.isSecureContext&&('serviceWorker' in navigator);
  let cached=false;
  function draw(){
    const offline=!navigator.onLine;
    bar.classList.toggle('offline',offline);
    bar.classList.toggle('ready',cached&&!offline);
    if(offline)label.textContent=cached?'当前离线 · 显示本设备最后保留的账目（不会跨设备同步）':'当前离线 · 首次需联网完成安装';

  }
  async function verify(){
    if(!isSecure){label.textContent='此预览需要部署在HTTPS网站才能安装并离线启动';return;}
    try{
      const registration=await navigator.serviceWorker.register('./service-worker.js',{scope:'./'});
      await navigator.serviceWorker.ready;
      const url=new URL('./index.html',location.href).href;
      const response=await caches.match(url,{ignoreSearch:true});
      cached=!!response;
      draw();
      // Recheck once when a browser's first-ever service worker install finishes.
      if(!cached&&registration.installing){
        registration.installing.addEventListener('statechange',async function(){if(this.state==='installed'||this.state==='activated'){
          cached=!!(await caches.match(url,{ignoreSearch:true}));draw();
        }});
      }
    }catch(err){cached=false;label.textContent='离线缓存未完成，请保持联网并重新打开页面';}
  }

     alert(tip+'\n\n新版 iPhone 首次联网打开后将自动尝试连接华为共享账本（如提示未登录，请先登录）。请确认顶部标识出现「云端只读」和版本号；仅看到「单机」不代表同步完成。\n\n正式收银前请用测试订单核对两端。');
  });

  window.addEventListener('load',verify);
})();
