plugins { id 'com.android.application' }
android {
    namespace 'com.youdu.teahouse'
    compileSdk 34
    defaultConfig {
        applicationId 'com.youdu.teahouse.cashier'
        minSdk 24
        targetSdk 34
        versionCode 180
        versionName '1.8.0'
    }
    // Release APK is intentionally unsigned in public GitHub Actions.
    // The private release PKCS12 key is never sent to the public repo.
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


