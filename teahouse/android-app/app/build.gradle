plugins { id 'com.android.application' }
android {
    namespace 'com.youdu.teahouse'
    compileSdk 34
    defaultConfig {
        applicationId 'com.youdu.teahouse.offline.v13'
        minSdk 24
        targetSdk 34
        versionCode 13
        versionName '1.3.0-offline'
    }
    // Explicit test signer; V13 and later can preserve app data on signed updates.
    signingConfigs {
        persistedTest {
            storeFile file(System.getenv('HOME') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.persistedTest }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
